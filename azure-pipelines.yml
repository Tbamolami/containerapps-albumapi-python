
trigger:
  branches:
    include:
      - main

pool:
  vmImage: ubuntu-latest

variables:
  imageName: album-api
  acrServiceConnection: arccontainer

steps:
  - checkout: self

  - task: Docker@2
    displayName: Build and push Album API to ACR
    inputs:
      command: buildAndPush
      containerRegistry: $(acrServiceConnection)
      repository: $(imageName)
      Dockerfile: $(Build.SourcesDirectory)/src/Dockerfile
      buildContext: $(Build.SourcesDirectory)/src
      tags: |
        $(Build.BuildId)
        latest

  - script: |
      echo "Image successfully built and pushed."
      echo "Repository: $(imageName)"
      echo "Build tag: $(Build.BuildId)"
      echo "Latest tag: latest"
    displayName: Confirm image build
